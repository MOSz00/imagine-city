<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagine City: คืนสุดท้ายก่อนสีจะหายไป</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <!-- กราฟิกเมือง & คลื่นความถี่สี (Imagine City Architecture SVG) -->
    <header class="city-visualizer" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>

      <!-- ป้ายชื่อเมืองมุมซ้ายบน -->
      <div class="city-hud">
        <span class="hud-tag">IMAGINE CITY // SDM</span>
        <span class="hud-pulse" id="pulsePercent">0% RESTORED</span>
      </div>

      <svg class="skyline-svg" viewBox="0 0 420 145" preserveAspectRatio="xMidYMax slice">
        <defs>
          <!-- แสงสปอตไลต์โซน AFX -->
          <linearGradient id="beamGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#4D61FC" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#4D61FC" stop-opacity="0"/>
          </linearGradient>
        </defs>

        <!-- เส้นวงโคจรคลื่นความถี่ด้านหลัง -->
        <circle cx="210" cy="145" r="95" class="freq-ring ring-1" />
        <circle cx="210" cy="145" r="135" class="freq-ring ring-2" />

        <!-- 1. โซน DGA (Digital Arts): หอศิลป์ทรงโค้ง & สตูดิโอ -->
        <g class="district-group b-dga">
          <path d="M12 144 V82 C12 68, 42 68, 42 82 V144 Z" />
          <circle cx="27" cy="84" r="6" class="win-dark" />
          <rect x="46" y="64" width="26" height="80" rx="13" />
          <path d="M52 80 Q59 74 66 80 M52 92 Q59 86 66 92" class="stroke-detail" />
        </g>

        <!-- 2. โซน DGD (Digital Graphic Design): ตึกกริด & บิลบอร์ด -->
        <g class="district-group b-dgd">
          <polygon points="82,144 82,58 112,46 112,144" />
          <!-- หน้าต่างกริด -->
          <rect x="88" y="66" width="5" height="5" class="win-light" />
          <rect x="98" y="62" width="5" height="5" class="win-light" />
          <rect x="88" y="78" width="5" height="5" class="win-light" />
          <rect x="98" y="74" width="5" height="5" class="win-light" />
          <rect x="88" y="90" width="5" height="5" class="win-light" />
          <rect x="98" y="86" width="5" height="5" class="win-light" />
          <!-- ตึกป้ายไฟ -->
          <rect x="118" y="54" width="32" height="90" rx="2" />
          <rect x="123" y="60" width="22" height="14" rx="1" class="win-dark" />
          <line x1="126" y1="65" x2="140" y2="65" class="stroke-amber" />
          <line x1="126" y1="69" x2="135" y2="69" class="stroke-amber" />
        </g>

        <!-- 3. โซน IGD (Interactive & Game): หอคอยพิกเซล & เกม -->
        <g class="district-group b-igd">
          <!-- ตึกขั้นบันไดพิกเซล -->
          <path d="M160 144 V78 H168 V66 H178 V54 H192 V66 H202 V78 H210 V144 Z" />
          <!-- สัญลักษณ์ D-Pad บนตึก -->
          <path d="M183 76 H187 V81 H192 V85 H187 V90 H183 V85 H178 V81 H183 Z" class="win-dark" />
          <!-- พิกเซลลอยตัว -->
          <rect x="172" y="42" width="4" height="4" class="pixel-float p1" />
          <rect x="194" y="38" width="5" height="5" class="pixel-float p2" />
          <rect x="216" y="72" width="22" height="72" rx="2" />
          <circle cx="227" cy="86" r="3" class="win-light" />
          <circle cx="227" cy="96" r="3" class="win-dark" />
        </g>

        <!-- 4. โซน AFX (Animation & VFX): หอคอยไซไฟ & ลำแสงโฮโลแกรม -->
        <g class="district-group b-afx">
          <!-- ลำแสงฉายขึ้นฟ้า -->
          <polygon points="262,48 248,10 282,10 268,48" fill="url(#beamGrad)" />
          <!-- ตัวตึกทรงสูงปลายแหลม -->
          <polygon points="248,144 252,56 265,36 278,56 282,144" />
          <line x1="265" y1="22" x2="265" y2="36" class="antenna-afx" />
          <!-- วงแหวนโฮโลแกรมรอบยอดตึก -->
          <ellipse cx="265" cy="54" rx="20" ry="4" class="holo-ring" />
          <rect x="288" y="66" width="24" height="78" rx="2" />
          <line x1="294" y1="76" x2="294" y2="132" class="stroke-light" />
          <line x1="300" y1="76" x2="300" y2="132" class="stroke-light" />
          <line x1="306" y1="76" x2="306" y2="132" class="stroke-light" />
        </g>

        <!-- 5. โซน DEN (Digital Entertainment): เวทีโดม & เสาคลื่นเสียง -->
        <g class="district-group b-den">
          <!-- หอกระจายเสียง -->
          <rect x="322" y="52" width="26" height="92" rx="2" />
          <line x1="335" y1="30" x2="335" y2="52" class="antenna-den" />
          <!-- คลื่นเสียงแผ่ออก -->
          <path d="M326 36 Q321 30 326 24 M344 36 Q349 30 344 24" class="sound-wave" />
          <path d="M321 40 Q313 30 321 20 M349 40 Q357 30 349 20" class="sound-wave" />
          <!-- โดมเวทีคอนเสิร์ต -->
          <path d="M354 144 V96 C354 74, 408 74, 408 96 V144 Z" />
          <path d="M366 144 V112 C366 100, 396 100, 396 112 V144 Z" class="win-dark" />
        </g>

        <!-- เส้นพื้นถนน -->
        <line x1="0" y1="144" x2="420" y2="144" class="ground-line"/>

        <!-- ดวงไฟนำทาง (เลื่อนตาม --progress) -->
        <g class="guiding-spark" id="guidingSpark">
          <circle cx="0" cy="0" r="10" class="spark-halo" />
          <circle cx="0" cy="0" r="3.5" class="spark-core" />
        </g>
      </svg>

      <div class="progress-bar-wrap" id="progressWrap" hidden>
        <div class="progress-dots" id="progressDots"></div>
      </div>
    </header>

    <!-- พื้นที่แสดงเนื้อหาแต่ละฉาก -->
    <main id="gameContainer" class="game-container" aria-live="polite">
      <p class="loading-text">กำลังโหลดสัญญาณชีพจรของเมือง...</p>
    </main>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
